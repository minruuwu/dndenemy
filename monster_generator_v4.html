<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎲 怪物產生器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f8f7f4;padding:1rem;color:#1a1a1a}
h1{font-size:18px;font-weight:600;text-align:center;margin-bottom:1rem}
.tabs{display:flex;gap:6px;margin-bottom:1rem}
.tab{flex:1;padding:9px;border-radius:10px;border:1.5px solid #e0ddd5;font-size:13px;cursor:pointer;background:#fff;color:#5f5e5a;text-align:center;font-weight:500}
.tab.on{border-color:#534AB7;background:#EEEDFE;color:#3C3489}
.section{background:#fff;border-radius:12px;border:0.5px solid #e0ddd5;padding:1rem;margin-bottom:1rem}
.sec-label{font-size:12px;font-weight:600;color:#5f5e5a;margin-bottom:8px}
select{width:100%;padding:9px 10px;border-radius:8px;border:0.5px solid #ccc;background:#fff;font-size:13px;color:#1a1a1a;margin-bottom:6px}
select:last-of-type{margin-bottom:0}
.lv-row{display:flex;gap:6px}
.lv{flex:1;padding:8px;border-radius:8px;border:1.5px solid #e0ddd5;font-size:12px;cursor:pointer;background:#fff;color:#5f5e5a;text-align:center}
.lv.on{border-color:#534AB7;background:#EEEDFE;color:#3C3489;font-weight:600}
.gen-btn{width:100%;padding:13px;background:#534AB7;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:1rem}
.gen-btn:active{background:#3C3489;transform:scale(0.98)}
.loc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.loc-btn{padding:9px 4px;border-radius:8px;border:1.5px solid #e0ddd5;font-size:12px;cursor:pointer;background:#fff;color:#5f5e5a;text-align:center}
.loc-btn.on{border-color:#534AB7;background:#EEEDFE;color:#3C3489;font-weight:600}
.result-area{display:none}
.result-area.show{display:block}
.phase-label{font-size:12px;font-weight:600;color:#5f5e5a;margin:10px 0 6px}
.monster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:4px}
.mcard{background:#fff;border:0.5px solid #e0ddd5;border-radius:12px;padding:.9rem}
.mcard-name{font-size:15px;font-weight:600;color:#1a1a1a;margin-bottom:10px}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:10px}
.stat-box{background:#f1efe8;border-radius:7px;padding:5px 4px;text-align:center}
.stat-label{font-size:10px;color:#5f5e5a;margin-bottom:3px}
.stat-val{display:flex;align-items:center;justify-content:center;gap:2px}
.stat-num{font-size:15px;font-weight:600;color:#1a1a1a;width:34px;text-align:center;border:none;background:transparent;-moz-appearance:textfield}
.stat-num::-webkit-inner-spin-button,.stat-num::-webkit-outer-spin-button{-webkit-appearance:none}
.stat-btn{width:20px;height:20px;border:0.5px solid #ccc;border-radius:5px;background:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#5f5e5a;padding:0;flex-shrink:0}
.skill-block{margin-bottom:8px}
.skill-title{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.skill-title.passive{color:#0A5C44}
.skill-title.active{color:#0C447C}
.skill-item{border-radius:6px;padding:5px 8px;font-size:11px;line-height:1.55;margin-bottom:3px}
.skill-item:last-child{margin-bottom:0}
.skill-item.passive{background:#E1F5EE;color:#0A5C44}
.skill-item.active{background:#E6F1FB;color:#0C447C}
.skill-name{font-weight:600}
.trait-section{background:#EEEDFE;border-radius:7px;padding:7px 9px;margin-top:8px}
.trait-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.trait-icon{font-size:16px}
.trait-select{flex:1;padding:4px 6px;border-radius:6px;border:0.5px solid #AFA9EC;background:#fff;font-size:11px;color:#3C3489;margin-bottom:0}
.trait-desc{font-size:11px;color:#534AB7;line-height:1.5;width:100%;border:none;background:transparent;resize:none}
.boss-banner{background:#8B0000;border-radius:8px;padding:8px 12px;margin-bottom:8px;color:#fff;font-size:12px;font-weight:600;text-align:center}
</style>
</head>
<body>
<h1>🎲 怪物產生器</h1>

<div class="tabs">
  <div class="tab on" onclick="switchTab('manual',this)">⚔️ 指定敵人</div>
  <div class="tab" onclick="switchTab('scene',this)">🗺️ 場地產生</div>
</div>

<div id="tab-manual">
  <div class="section">
    <div class="sec-label">選擇敵人（最多5個，可重複）</div>
    <select id="e1"><option value="">— 不使用 —</option></select>
    <select id="e2"><option value="">— 不使用 —</option></select>
    <select id="e3"><option value="">— 不使用 —</option></select>
    <select id="e4"><option value="">— 不使用 —</option></select>
    <select id="e5"><option value="">— 不使用 —</option></select>
  </div>
  <div class="section">
    <div class="sec-label">強度</div>
    <div class="lv-row" id="lv-manual">
      <div class="lv" onclick="setLv(this,1,'manual')">1 熱身</div>
      <div class="lv on" onclick="setLv(this,2,'manual')">2 普通</div>
      <div class="lv" onclick="setLv(this,3,'manual')">3 困難</div>
      <div class="lv" onclick="setLv(this,4,'manual')">4 精英</div>
    </div>
  </div>
  <button class="gen-btn" onclick="generateManual()">🎲 產生敵人面板</button>
</div>

<div id="tab-scene" style="display:none">
  <div class="section">
    <div class="sec-label">場地</div>
    <div class="loc-grid">
      <div class="loc-btn on" onclick="setLoc(this,'inn')">🍺 旅館</div>
      <div class="loc-btn" onclick="setLoc(this,'forest')">🌲 森林</div>
      <div class="loc-btn" onclick="setLoc(this,'dungeon')">⚰️ 地下墓穴</div>
      <div class="loc-btn" onclick="setLoc(this,'wall')">🏯 城牆</div>
      <div class="loc-btn" onclick="setLoc(this,'tower')">🗼 巫師塔</div>
      <div class="loc-btn" onclick="setLoc(this,'boss')">💀 BOSS場</div>
    </div>
  </div>
  <div class="section" id="lv-scene-wrap">
    <div class="sec-label">強度</div>
    <div class="lv-row" id="lv-scene">
      <div class="lv" onclick="setLv(this,1,'scene')">1 熱身</div>
      <div class="lv on" onclick="setLv(this,2,'scene')">2 普通</div>
      <div class="lv" onclick="setLv(this,3,'scene')">3 困難</div>
      <div class="lv" onclick="setLv(this,4,'scene')">4 精英</div>
    </div>
  </div>
  <button class="gen-btn" onclick="generateScene()">🎲 產生怪物組合</button>
</div>

<div class="result-area" id="result-area"></div>

<script>
const TRAITS=[

    active:[{name:'鮮血禮讚',desc:'對全體玩家各自擲骰，骰1–10造成5點傷害，每名受傷的玩家為領主回復1點生命（每2回合使用一次）'}]},

const SCENE={

let curLvManual=2,curLvScene=2,curLoc='inn';

function switchTab(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('tab-manual').style.display=tab==='manual'?'':'none';
  document.getElementById('tab-scene').style.display=tab==='scene'?'':'none';
  const ra=document.getElementById('result-area');
  ra.className='result-area';ra.innerHTML='';
}

function setLv(el,v,mode){
  if(mode==='manual'){curLvManual=v;document.querySelectorAll('#lv-manual .lv').forEach(e=>e.classList.remove('on'));}
  else{curLvScene=v;document.querySelectorAll('#lv-scene .lv').forEach(e=>e.classList.remove('on'));}
  el.classList.add('on');
}

function setLoc(el,v){
  curLoc=v;
  document.querySelectorAll('.loc-btn').forEach(e=>e.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('lv-scene-wrap').style.display=v==='boss'?'none':'block';
}

function randTrait(){return TRAITS[Math.floor(Math.random()*TRAITS.length)];}

function traitOptions(sel){
  return TRAITS.map(t=>`<option value="${t.label}"${t.label===sel?' selected':''}>${t.icon} ${t.label}</option>`).join('');
}

function renderCard(name,lv){
  const d=M[name];
  const t=lv<=2?0:1;
  const hp=d.hp[t],atk=d.atk[t],def=d.def;
  const tr=randTrait();
  const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

  const passiveHTML=d.passive.length?`<div class="skill-block">
    <div class="skill-title passive">🟢 被動技能</div>
    ${d.passive.map(s=>`<div class="skill-item passive"><span class="skill-name">${s.name}：</span>${s.desc}</div>`).join('')}
  </div>`:'';

  const activeHTML=d.active.length?`<div class="skill-block">
    <div class="skill-title active">🔵 主動技能</div>
    ${d.active.map(s=>`<div class="skill-item active"><span class="skill-name">${s.name}：</span>${s.desc}</div>`).join('')}
  </div>`:'';

  return `<div class="mcard">
    <div class="mcard-name">${name}</div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">生命</div>
        <div class="stat-val">
          <button class="stat-btn" onclick="adj('${id}','hp',-1)">−</button>
          <input class="stat-num" type="number" value="${hp}" id="${id}-hp" min="0">
          <button class="stat-btn" onclick="adj('${id}','hp',1)">+</button>
        </div>
      </div>
      <div class="stat-box">
        <div class="stat-label">攻擊</div>
        <div class="stat-val">
          <button class="stat-btn" onclick="adj('${id}','atk',-1)">−</button>
          <input class="stat-num" type="number" value="${atk}" id="${id}-atk" min="0">
          <button class="stat-btn" onclick="adj('${id}','atk',1)">+</button>
        </div>
      </div>
      <div class="stat-box">
        <div class="stat-label">減傷</div>
        <div class="stat-val">
          <button class="stat-btn" onclick="adj('${id}','def',-1)">−</button>
          <input class="stat-num" type="number" value="${def}" id="${id}-def" min="0">
          <button class="stat-btn" onclick="adj('${id}','def',1)">+</button>
        </div>
      </div>
    </div>
    ${passiveHTML}${activeHTML}
    <div class="trait-section">
      <div class="trait-top">
        <span class="trait-icon" id="${id}-icon">${tr.icon}</span>
        <select class="trait-select" id="${id}-sel" onchange="changeTrait('${id}')">
          ${traitOptions(tr.label)}
        </select>
      </div>
      <textarea class="trait-desc" rows="2" id="${id}-desc">${tr.desc}</textarea>
    </div>
  </div>`;
}

function adj(id,stat,delta){
  const el=document.getElementById(id+'-'+stat);
  el.value=Math.max(0,(parseInt(el.value)||0)+delta);
}

function changeTrait(id){
  const label=document.getElementById(id+'-sel').value;
  const tr=TRAITS.find(t=>t.label===label);
  if(tr){
    document.getElementById(id+'-icon').textContent=tr.icon;
    document.getElementById(id+'-desc').value=tr.desc;
  }
}

function initSelects(){
  const opts='<option value="">— 不使用 —</option>'+ENEMY_NAMES.map(n=>`<option value="${n}">${n}</option>`).join('');
  for(let i=1;i<=5;i++) document.getElementById('e'+i).innerHTML=opts;
}

function generateManual(){
  const names=[];
  for(let i=1;i<=5;i++){const v=document.getElementById('e'+i).value;if(v)names.push(v);}
  if(!names.length){alert('請至少選一個敵人！');return;}
  const ra=document.getElementById('result-area');
  ra.className='result-area show';
  ra.innerHTML='<div class="monster-grid">'+names.map(n=>renderCard(n,curLvManual)).join('')+'</div>';
}

function generateScene(){
  let names,lv,isBoss=curLoc==='boss';
  if(isBoss){
    const pool=SCENE.boss.boss;
    names=pool[Math.floor(Math.random()*pool.length)].map(([n])=>n);
    lv=4;
  } else {
    const pool=SCENE[curLoc][curLvScene];
    names=pool[Math.floor(Math.random()*pool.length)].map(([n])=>n);
    lv=curLvScene;
  }
  const ra=document.getElementById('result-area');
  ra.className='result-area show';
  if(isBoss){
    ra.innerHTML=`<div class="boss-banner">💀 BOSS 決戰！</div>
      <div class="phase-label">⚔️ 第一階段</div>
      <div class="monster-grid">${names.map(n=>renderCard(n,4)).join('')}</div>
      <div class="phase-label">🐉 第二階段</div>
      <div class="monster-grid">${renderCard('紅龍',4)}</div>`;
  } else {
    ra.innerHTML='<div class="monster-grid">'+names.map(n=>renderCard(n,lv)).join('')+'</div>';
  }
}

initSelects();
</script>
</body>
</html>
